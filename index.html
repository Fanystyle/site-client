<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q-Park · Dotation textile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#111111;
  --rouge:#E2001A;
  --blanc:#FFFFFF;
  --gris-clair:#F4F4F4;
  --gris:#8A8A8A;
  --trait:#E3E3E3;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Jost',sans-serif;color:var(--noir);background:var(--blanc);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
.hidden{display:none!important}

/* ---------- Barre haute ---------- */
header{
  position:sticky;top:0;z-index:50;background:var(--blanc);
  border-bottom:1px solid var(--trait);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;
}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer}
.brand img{height:34px}
.brand .ctx{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gris);border-left:1px solid var(--trait);padding-left:14px}
.hdr-actions{display:flex;align-items:center;gap:10px}
.btn-ghost{
  background:none;border:1px solid var(--noir);color:var(--noir);
  padding:9px 18px;font-size:14px;font-weight:500;letter-spacing:.04em;
  transition:background .15s,color .15s;
}
.btn-ghost:hover{background:var(--noir);color:var(--blanc)}
.btn-panier{
  position:relative;background:var(--noir);color:var(--blanc);border:1px solid var(--noir);
  padding:9px 18px;font-size:14px;font-weight:500;letter-spacing:.04em;
  display:flex;align-items:center;gap:8px;transition:background .15s;
}
.btn-panier:hover{background:var(--rouge);border-color:var(--rouge)}
.badge{
  background:var(--rouge);color:var(--blanc);font-size:12px;font-weight:600;
  min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;
}

/* ---------- Accueil double entité ---------- */
.accueil{min-height:calc(100vh - 64px);display:flex;flex-direction:column}
.accueil-titre{text-align:center;padding:54px 20px 30px}
.accueil-titre .sur{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--rouge);font-weight:600;margin-bottom:12px}
.accueil-titre h1{font-size:clamp(26px,4vw,42px);font-weight:600;letter-spacing:-.01em}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;position:relative}
.entite{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  padding:60px 40px;background:var(--blanc);border:none;
  position:relative;overflow:hidden;transition:background .25s;
}
.entite + .entite{border-left:1px solid var(--trait)}
.entite img{max-height:120px;width:auto;max-width:78%;object-fit:contain;position:relative;z-index:2;transition:transform .3s}
.entite .lib{position:relative;z-index:2;text-align:center}
.entite .lib .nom{font-size:20px;font-weight:600;letter-spacing:.02em}
.entite .lib .desc{font-size:15px;color:var(--gris);margin-top:6px}
.entite .acceder{
  position:relative;z-index:2;display:inline-flex;align-items:center;gap:10px;
  font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--noir);border-bottom:2px solid var(--rouge);padding-bottom:4px;
  transition:gap .2s;
}
.entite::after{ /* parallélogramme rouge signature */
  content:"";position:absolute;bottom:-40px;right:-60px;width:220px;height:90px;
  background:var(--rouge);transform:skewX(-35deg);opacity:0;transition:opacity .3s,transform .3s;
}
.entite:hover{background:var(--gris-clair)}
.entite:hover img{transform:scale(1.04)}
.entite:hover::after{opacity:1;transform:skewX(-35deg) translateX(-20px)}
.entite:hover .acceder{gap:16px}
@media(prefers-reduced-motion:reduce){.entite img,.entite::after,.entite .acceder{transition:none}}

/* ---------- Catalogue ---------- */
.page{max-width:1180px;margin:0 auto;padding:40px 28px 90px}
.fil{font-size:13px;color:var(--gris);letter-spacing:.05em;margin-bottom:8px}
.fil a{color:var(--gris);text-decoration:none;cursor:pointer}
.fil a:hover{color:var(--noir)}
.page-titre{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:34px;border-bottom:3px solid var(--noir);padding-bottom:18px}
.page-titre h2{font-size:clamp(24px,3.2vw,34px);font-weight:600}
.page-titre .nb{font-size:14px;color:var(--gris)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px}
.carte{
  border:1px solid var(--trait);background:var(--blanc);text-align:left;
  display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s;padding:0;
}
.carte:hover{border-color:var(--noir);box-shadow:0 6px 22px rgba(0,0,0,.07)}
.carte .visu{background:var(--gris-clair);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:26px}
.carte .visu svg{width:100%;height:100%}
.carte .infos{padding:16px 18px 20px;display:flex;flex-direction:column;gap:4px}
.carte .cat{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--rouge);font-weight:600}
.carte .nom{font-size:17px;font-weight:600}
.carte .tailles{font-size:13px;color:var(--gris)}

/* ---------- Fiche produit ---------- */
.fiche{display:grid;grid-template-columns:1fr 1fr;gap:54px;align-items:start}
.fiche .visu{background:var(--gris-clair);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:56px;position:sticky;top:90px}
.fiche .visu svg{width:100%;height:100%}
.fiche .cat{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--rouge);font-weight:600;margin-bottom:8px}
.fiche h2{font-size:clamp(26px,3vw,36px);font-weight:600;margin-bottom:14px}
.fiche .desc{font-size:16px;line-height:1.65;color:#3c3c3c;margin-bottom:28px}
.fiche .spec{border-top:1px solid var(--trait);padding:12px 0;display:flex;gap:14px;font-size:14px}
.fiche .spec dt{width:130px;color:var(--gris);flex-shrink:0}
.fiche .spec dd{font-weight:500}
.choix{margin:28px 0}
.choix .lab{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:10px;display:flex;gap:8px}
.choix .lab .val{color:var(--rouge)}
.tailles-grp{display:flex;flex-wrap:wrap;gap:8px}
.t-btn{
  border:1px solid var(--trait);background:var(--blanc);min-width:48px;padding:10px 12px;
  font-size:14px;font-weight:500;transition:all .12s;
}
.t-btn:hover{border-color:var(--noir)}
.t-btn.actif{background:var(--noir);color:var(--blanc);border-color:var(--noir)}
.qte{display:flex;align-items:center;border:1px solid var(--trait);width:fit-content}
.qte button{background:none;border:none;width:42px;height:44px;font-size:20px;line-height:1}
.qte button:hover{background:var(--gris-clair)}
.qte input{width:54px;height:44px;border:none;border-left:1px solid var(--trait);border-right:1px solid var(--trait);text-align:center;font-family:inherit;font-size:16px;font-weight:600}
.qte input:focus{outline:2px solid var(--noir);outline-offset:-2px}
.btn-add{
  width:100%;background:var(--rouge);color:var(--blanc);border:none;padding:17px;
  font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;
  transition:background .15s;
}
.btn-add:hover{background:#b80015}
.btn-add:disabled{background:#ccc;cursor:not-allowed}
.alerte-taille{color:var(--rouge);font-size:13px;margin-top:8px;min-height:18px}
.ajoute-ok{
  margin-top:14px;background:var(--gris-clair);border-left:3px solid var(--rouge);
  padding:12px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.ajoute-ok a{color:var(--noir);font-weight:600;cursor:pointer;text-decoration:underline}

/* ---------- Panier ---------- */
.panier-wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:50px;align-items:start}
.lignes{display:flex;flex-direction:column}
.ligne{display:grid;grid-template-columns:86px 1fr auto;gap:18px;padding:18px 0;border-bottom:1px solid var(--trait);align-items:center}
.ligne .mini{background:var(--gris-clair);width:86px;height:86px;display:flex;align-items:center;justify-content:center;padding:12px}
.ligne .mini svg{width:100%;height:100%}
.ligne .nom{font-weight:600;font-size:16px}
.ligne .detail{font-size:13px;color:var(--gris);margin-top:2px}
.ligne .actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ligne .qte{transform:scale(.85);transform-origin:right}
.suppr{background:none;border:none;color:var(--gris);font-size:13px;text-decoration:underline}
.suppr:hover{color:var(--rouge)}
.panier-vide{text-align:center;padding:80px 20px;color:var(--gris)}
.panier-vide .p-icone{font-size:46px;margin-bottom:10px}
.recap{border:1px solid var(--trait);padding:28px}
.recap h3{font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;padding-bottom:14px;border-bottom:3px solid var(--noir)}
.recap .note{font-size:13px;color:var(--gris);margin:10px 0 18px;line-height:1.5}
.champ{margin-bottom:14px}
.champ label{display:block;font-size:13px;font-weight:600;letter-spacing:.06em;margin-bottom:5px}
.champ label .req{color:var(--rouge)}
.champ input,.champ select,.champ textarea{
  width:100%;border:1px solid var(--trait);padding:11px 12px;font-family:inherit;font-size:14px;background:var(--blanc);
}
.champ input:focus,.champ select:focus,.champ textarea:focus{outline:2px solid var(--noir);outline-offset:-1px}
.champ textarea{resize:vertical;min-height:80px}
.deux-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-valider{
  width:100%;background:var(--noir);color:var(--blanc);border:none;padding:16px;
  font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:8px;transition:background .15s;
}
.btn-valider:hover{background:var(--rouge)}
.err-form{color:var(--rouge);font-size:13px;margin-top:10px;min-height:18px}

/* ---------- Confirmation ---------- */
.confirm{max-width:640px;margin:0 auto;text-align:center;padding:70px 20px}
.confirm .coche{
  width:74px;height:74px;border-radius:50%;background:var(--rouge);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 24px;
}
.confirm h2{font-size:30px;font-weight:600;margin-bottom:12px}
.confirm p{color:var(--gris);font-size:16px;line-height:1.6;margin-bottom:8px}
.confirm .ref{font-weight:600;color:var(--noir);font-size:18px;margin:18px 0 30px;letter-spacing:.08em}
.recap-final{text-align:left;border:1px solid var(--trait);padding:22px;margin-bottom:30px;font-size:14px}
.recap-final h4{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--rouge);margin-bottom:12px}
.recap-final .rf-ligne{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--trait)}
.recap-final .rf-ligne:last-child{border-bottom:none}

footer{
  border-top:1px solid var(--trait);padding:26px 28px;display:flex;justify-content:space-between;
  align-items:center;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--gris);
}
footer .slash{display:inline-block;width:26px;height:11px;background:var(--rouge);transform:skewX(-35deg);margin-right:10px;vertical-align:middle}

@media(max-width:860px){
  .split{grid-template-columns:1fr}
  .entite + .entite{border-left:none;border-top:1px solid var(--trait)}
  .fiche{grid-template-columns:1fr}
  .fiche .visu{position:static}
  .panier-wrap{grid-template-columns:1fr}
  header{padding:12px 16px}
  .brand .ctx{display:none}
  .page{padding:28px 16px 70px}
}
</style>
</head>

       desc:"Bonnet maille double épaisseur, coloris marine, marquage brodé. Indispensable pour les tournées hivernales.",
       matiere:"100 % acrylique doublé polaire", entretien:"Lavage 30 °C", tailles:TU},
    ]
  }
};

/* ============================================================
   ÉTAT + NAVIGATION
   ============================================================ */
let entiteActive = null;
let produitActif = null;
let panier = []; // {pid, entite, nom, taille, qte, svg}

const $ = id => document.getElementById(id);
const VUES = ["accueil","catalogue","produit","panier","confirm"];

function aller(vue){
  VUES.forEach(v => $("vue-"+v).classList.toggle("hidden", v!==vue));
  $("btn-cat").style.display = (vue==="produit"||vue==="panier") && entiteActive ? "" : "none";
  if(vue==="panier") rendrePanier();
  window.scrollTo({top:0});
}
function ouvrirEntite(cle){
  entiteActive = cle;
  const e = ENTITES[cle];
  $("ctx-entite").textContent = e.nom;
  $("fil-entite").textContent = e.nom;
  $("cat-titre").textContent = e.sousTitre;
  $("cat-nb").textContent = e.produits.length + " articles";
  $("grille").innerHTML = e.produits.map(p => `
    <button class="carte" onclick="ouvrirProduit('${p.id}')">
      <span class="visu">${p.svg}</span>
      <span class="infos">
        <span class="cat">${p.cat}</span>
        <span class="nom">${p.nom}</span>
        <span class="tailles">${p.tailles.length>1 ? p.tailles[0]+" → "+p.tailles[p.tailles.length-1] : p.tailles[0]}</span>
      </span>
    </button>`).join("");
  aller("catalogue");
}
function retourCatalogue(){ if(entiteActive){ ouvrirEntite(entiteActive); } else { aller("accueil"); } }

/* ============================================================
   FICHE PRODUIT
   ============================================================ */
let selTaille = null, selQte = 1;

function ouvrirProduit(pid){
  const e = ENTITES[entiteActive];
  const p = e.produits.find(x=>x.id===pid);
  produitActif = p; selTaille = p.tailles.length===1 ? p.tailles[0] : null; selQte = 1;
  $("fil-cat").textContent = e.nom;
  $("fil-prod").textContent = p.nom;
  $("fiche").innerHTML = `
    <div class="visu">${p.svg}</div>
    <div>
      <div class="cat">${e.nom} · ${p.cat}</div>
      <h2>${p.nom}</h2>
      <p class="desc">${p.desc}</p>
      <dl>
        <div class="spec"><dt>Matière</dt><dd>${p.matiere}</dd></div>
        <div class="spec"><dt>Entretien</dt><dd>${p.entretien}</dd></div>
        <div class="spec"><dt>Marquage</dt><dd>Logo / mentions ${e.nom} inclus</dd></div>
      </dl>
      <div class="choix">
        <div class="lab">Taille <span class="val" id="val-taille">${selTaille??""}</span></div>
        <div class="tailles-grp" id="grp-tailles">
          ${p.tailles.map(t=>`<button class="t-btn ${t===selTaille?'actif':''}" onclick="choisirTaille('${t}',this)">${t}</button>`).join("")}
        </div>
      </div>
      <div class="choix">
        <div class="lab">Quantité</div>
        <div class="qte">
          <button onclick="changerQte(-1)" aria-label="Diminuer">−</button>
          <input id="inp-qte" type="number" min="1" max="20" value="1" onchange="majQte(this)">
          <button onclick="changerQte(1)" aria-label="Augmenter">+</button>
        </div>
      </div>
      <button class="btn-add" onclick="ajouterPanier()">Ajouter au panier</button>
      <div class="alerte-taille" id="alerte"></div>
      <div id="zone-ok"></div>
    </div>`;
  aller("produit");
}
function choisirTaille(t, btn){
  selTaille = t;
  document.querySelectorAll("#grp-tailles .t-btn").forEach(b=>b.classList.remove("actif"));
  btn.classList.add("actif");
  $("val-taille").textContent = t;
  $("alerte").textContent = "";
}
function changerQte(d){
  selQte = Math.min(20, Math.max(1, selQte + d));
  $("inp-qte").value = selQte;
}
function majQte(inp){
  selQte = Math.min(20, Math.max(1, parseInt(inp.value)||1));
  inp.value = selQte;
}
function ajouterPanier(){
  if(!selTaille){ $("alerte").textContent = "Veuillez sélectionner une taille."; return; }
  const existant = panier.find(l => l.pid===produitActif.id && l.taille===selTaille);
  if(existant){ existant.qte = Math.min(20, existant.qte + selQte); }
  else {
    panier.push({pid:produitActif.id, entite:entiteActive, nom:produitActif.nom, taille:selTaille, qte:selQte, svg:produitActif.svg});
  }
  majBadge();
  $("zone-ok").innerHTML = `<div class="ajoute-ok">
    <span>✓ ${produitActif.nom} (${selTaille}) ×${selQte} ajouté au panier.</span>
    <a onclick="aller('panier')">Voir le panier</a>
  </div>`;
}
function majBadge(){
  $("badge").textContent = panier.reduce((s,l)=>s+l.qte,0);
}

/* ============================================================
   PANIER + FORMULAIRE
   ============================================================ */
function rendrePanier(){
  const tot = panier.reduce((s,l)=>s+l.qte,0);
  $("panier-nb").textContent = tot ? tot + " article" + (tot>1?"s":"") : "";
  if(!panier.length){
    $("panier-contenu").innerHTML = `<div class="panier-vide">
      <div class="p-icone">🛒</div>
      <p>Votre panier est vide.</p>
      <p style="margin-top:16px"><button class="btn-ghost" onclick="aller('accueil')">Choisir une entité</button></p>
    </div>`;
    return;
  }
  $("panier-contenu").innerHTML = `
  <div class="panier-wrap">
    <div class="lignes">
      ${panier.map((l,i)=>`
      <div class="ligne">
        <div class="mini">${l.svg}</div>
        <div>
          <div class="nom">${l.nom}</div>
          <div class="detail">${ENTITES[l.entite].nom} · Taille ${l.taille}</div>
        </div>
        <div class="actions">
          <div class="qte">
            <button onclick="qteLigne(${i},-1)" aria-label="Diminuer">−</button>
            <input type="number" min="1" max="20" value="${l.qte}" onchange="qteLigneInput(${i},this)">
            <button onclick="qteLigne(${i},1)" aria-label="Augmenter">+</button>
          </div>
          <button class="suppr" onclick="supprLigne(${i})">Retirer</button>
        </div>
      </div>`).join("")}
    </div>
    <form class="recap" onsubmit="validerCommande(event)">
      <h3>Informations complémentaires</h3>
      <p class="note">Ces informations permettent de préparer et livrer votre dotation. Les champs marqués <span style="color:var(--rouge)">*</span> sont obligatoires.</p>
      <div class="deux-cols">
        <div class="champ"><label>Nom <span class="req">*</span></label><input id="f-nom" required></div>
        <div class="champ"><label>Prénom <span class="req">*</span></label><input id="f-prenom" required></div>
      </div>
      <div class="champ"><label>Entité <span class="req">*</span></label>
        <select id="f-entite" required>
          <option value="">— Sélectionner —</option>
          <option>Q-Park</option>
          <option>Q-Park Voirie</option>
        </select>
      </div>
      <div class="champ"><label>Site / Ville d'affectation <span class="req">*</span></label><input id="f-site" placeholder="Ex. : Parc Hôtel de Ville — Paris" required></div>
      <div class="deux-cols">
        <div class="champ"><label>E-mail <span class="req">*</span></label><input id="f-email" type="email" required></div>
        <div class="champ"><label>Téléphone</label><input id="f-tel" type="tel" placeholder="06 00 00 00 00"></div>
      </div>
      <div class="champ"><label>Matricule / N° agent</label><input id="f-matricule"></div>
      <div class="champ"><label>Commentaire</label><textarea id="f-comm" placeholder="Précisions sur la livraison, les tailles, etc."></textarea></div>
      <button type="submit" class="btn-valider">Valider ma commande</button>
      <div class="err-form" id="err-form"></div>
    </form>
  </div>`;
}
function qteLigne(i,d){ panier[i].qte = Math.min(20, Math.max(1, panier[i].qte+d)); majBadge(); rendrePanier(); }
function qteLigneInput(i,inp){ panier[i].qte = Math.min(20, Math.max(1, parseInt(inp.value)||1)); majBadge(); rendrePanier(); }
function supprLigne(i){ panier.splice(i,1); majBadge(); rendrePanier(); }

function validerCommande(ev){
  ev.preventDefault();
  const f = {
    nom:$("f-nom").value.trim(), prenom:$("f-prenom").value.trim(),
    entite:$("f-entite").value, site:$("f-site").value.trim(),
    email:$("f-email").value.trim(), tel:$("f-tel").value.trim(),
    matricule:$("f-matricule").value.trim(), comm:$("f-comm").value.trim()
  };
  if(!f.nom||!f.prenom||!f.entite||!f.site||!f.email){
    $("err-form").textContent = "Merci de renseigner tous les champs obligatoires.";
    return;
  }
  const ref = "QP-" + new Date().getFullYear() + "-" + String(Math.floor(Math.random()*90000)+10000);
  const lignes = panier.map(l=>`<div class="rf-ligne"><span>${l.nom} — Taille ${l.taille}</span><span>×${l.qte}</span></div>`).join("");
  $("confirm-bloc").innerHTML = `
    <div class="coche">✓</div>
    <h2>Commande envoyée</h2>
    <p>Merci ${f.prenom} ${f.nom}. Votre demande de dotation a bien été enregistrée et sera traitée par votre responsable.</p>
    <div class="ref">Référence : ${ref}</div>
    <div class="recap-final">
      <h4>Récapitulatif</h4>
      ${lignes}
      <div class="rf-ligne" style="margin-top:10px"><span>Entité</span><span>${f.entite}</span></div>
      <div class="rf-ligne"><span>Site</span><span>${f.site}</span></div>
      <div class="rf-ligne"><span>Contact</span><span>${f.email}${f.tel? " · "+f.tel : ""}</span></div>
      ${f.matricule?`<div class="rf-ligne"><span>Matricule</span><span>${f.matricule}</span></div>`:""}
      ${f.comm?`<div class="rf-ligne"><span>Commentaire</span><span>${f.comm}</span></div>`:""}
    </div>
    <button class="btn-ghost" onclick="reinitialiser()">Retour à l'accueil</button>`;
  panier = []; majBadge();
  aller("confirm");
}
function reinitialiser(){ entiteActive=null; $("ctx-entite").textContent="Dotation textile"; aller("accueil"); }
</script>
</body>
</html>
